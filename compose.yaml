services:
  api:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      APP_TOKEN: ${APP_TOKEN:-}
      STREAMING_MODEL: ${STREAMING_MODEL:-moss}
      MOSS_WS_URL: ${MOSS_WS_URL:-ws://host.docker.internal:8001/v1/realtime}
      MODEL_REVISION: ${MODEL_REVISION:-unconfigured}
      ENHANCEMENT_MODEL: ${ENHANCEMENT_MODEL:-bypass}
      ENABLE_RELAY_VSR: "false"
      ENABLE_RELIFT: "false"
    volumes: ["./data:/app/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Use with a domain pointed at this machine. For a temporary demo, see README tunnel setup.
  caddy:
    image: caddy:2.10.0
    profiles: ["https"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SAFESC_DOMAIN: ${SAFESC_DOMAIN:-localhost}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [api]
volumes:
  caddy_data:
  caddy_config:
