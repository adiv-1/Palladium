[project]
name = "safesc"
version = "0.1.0"
description = "Human-reviewed campus video incident triage"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlmodel==0.0.24",
  "python-multipart==0.0.20",
  "pydantic-settings==2.9.1",
  "av==16.0.1",
  "opencv-python-headless==4.11.0.86",
  "numpy==2.2.5",
  "httpx==0.28.1",
  "websockets==15.0.1",
  "pillow==11.2.1",
  "imageio-ffmpeg==0.6.0",
  "anthropic>=2.8.0",
]
[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]
tracking = ["supervision==0.25.1", "ultralytics==8.3.125"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
