# SafeSC theft-detection module - example configuration.
# Every key is optional; the values below are the built-in defaults unless noted.
# Speeds and distances in `engine` are in body heights (the pixel height of the person involved).

source:
  source_id: test_camera_01
  uri: "0"                 # video file | webcam index | rtsp://... | synthetic:<scenario>
  pace: realtime           # realtime: drop stale frames like a live camera. fast: analyse every sampled frame.
  analysis_fps: 10         # measured: below ~8 fps short run-by grabs start to be missed (docs/EVALUATION.md)
  max_width: 960           # frames are downscaled to this width before anything else
  queue_size: 2            # bounded; when analysis is slow the oldest frame is dropped
  reconnect_attempts: 5    # live sources only
  reconnect_backoff_s: 1.0

detector:
  backend: yolox_onnx      # yolox_onnx (real) | color_blob (synthetic scenes only)
  model: yolox_tiny        # yolox_nano | yolox_tiny | yolox_s | path/to/model.onnx
  weights_dir: weights
  providers: [CPUExecutionProvider]
  intra_op_threads: 4      # upper bound on detector CPU threads
  min_score: 0.10
  classes: {person: person, backpack: bag, handbag: bag, suitcase: bag, laptop: bag, "cell phone": bag, book: bag, umbrella: bag}

pose:                       # body keypoints for the action route (people near another person only)
  enabled: true
  model: rtmpose_t         # rtmpose_t | rtmpose_s
  threads: 2
  max_people: 6

tracker:
  high_thresh: {person: 0.45, bag: 0.30}
  new_track_thresh: {person: 0.55, bag: 0.35}
  max_lost_s: {person: 1.5, bag: 2.0}

engine:
  hold_min_s: 1.0          # how long an object must stay with a person before they count as its holder
  min_verify_s: 0.5        # earliest decision after a candidate
  holder_check_frames: 4   # frames inspected for a bag still with the prior holder (measured: 4 beats 6 and 8)
  verify_window_s: 2.0     # latest decision
  fast_speed: 1.3          # object must leave faster than this (brisk walking is ~0.9)
  speed_jump: 0.8          # ... and have sped up by at least this much
  separation_min: 1.4      # ... and end this far from the prior holder
  review_min_score: 0.60
  unattended_min_s: 3.0    # stationary and unaccompanied this long = "resting unattended"
  carry_min: 1.0           # a lifted object must travel this far to count as removed
  zone_dwell_s: 1.0
  cooldown_s: 10.0
  action_reach: 0.25       # arm extension towards the other person that counts as reaching
  action_hand_dist: 0.15   # wrists this close = hand contact
  action_pull_apart: 0.3   # torsos moving this far apart while both pull = a tug
  emit_info_events: true
  emit_unknown_origin_pickups: false

# Zones are opt-in. Coordinates are normalised (0-1) image positions, listed in order.
zones: []
#  - zone_id: staff_only
#    kind: restricted       # a person standing inside -> possible_restricted_area_entry
#    polygon: [[0.62, 0.50], [0.95, 0.50], [0.95, 1.00], [0.62, 1.00]]
#  - zone_id: bag_rack
#    kind: monitored        # removal of a resting object from inside is reviewable
#    polygon: [[0.40, 0.55], [0.60, 0.55], [0.60, 1.00], [0.40, 1.00]]

evidence:
  enabled: false           # default: nothing is written to disk
  directory: data/evidence
  pre_s: 3.0
  post_s: 2.0
  retention_hours: 24

events:
  max_stored: 500
  jsonl_path: null         # e.g. data/events.jsonl (metadata only, no pixels)
  webhook:
    url: null              # nothing is sent anywhere unless you set this
    secret: null

api:
  host: 127.0.0.1
  port: 8077
  token: null              # set to require "Authorization: Bearer <token>"
  demo_dir: data
  allow_network_sources: false
